<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ef9cbd">
    <title>PRACTICE NG MAY BITAW</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <audio id="bg-music" loop preload="auto">
        <source src="OLD LOVE.mp3" type="audio/mpeg">
    </audio>

    <div class="hearts-container" aria-hidden="true"></div>

    <div id="welcome-popup" class="correct-popup welcome-popup" role="dialog" aria-modal="true" aria-labelledby="welcome-title" aria-describedby="welcome-message">
        <div class="correct-popup-content">
            <h2 id="welcome-title">A little surprise for you 💗</h2>
            <p id="welcome-message">Press Start when you're ready.</p>
            <button id="start-button" type="button">Start 💕</button>
        </div>
    </div>

    <main class="container" id="main-card" inert>
        <img src="hart.png" class="top-hearts" alt="" aria-hidden="true">
        <h1>What's the name of your boyfriend?</h1>
        <form id="name-form" class="boyfriend-name">
            <label class="visually-hidden" for="boyfriend-name">Boyfriend's first name</label>
            <input type="text" id="boyfriend-name" placeholder="Input First Name..." autocomplete="off" required>
            <button class="submit-btn" type="submit">Submit</button>
        </form>
    </main>

    <div id="correct-popup" class="correct-popup" role="dialog" aria-modal="true" aria-labelledby="popup-title" aria-describedby="popup-message" hidden>
        <div class="correct-popup-content">
            <h2 id="popup-title"></h2>
            <p id="popup-message"></p>
            <button id="popup-button" type="button"></button>
        </div>
    </div>

    <section id="letter-container" class="container" aria-label="Monthsary letter" hidden>
        <img src="hart.png" class="top-hearts" alt="" aria-hidden="true">
        <h2>Happy Monthsary Dang ❤️</h2>
        <div class="letter-content">
            <p>
                Dear Baby dang,<br><br>
                jakol,<br>
                IRENE
            </p>
        </div>
    </section>
</body>
</html>
